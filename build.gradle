plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Flyway core and flyway-mysql dependencies for database migrations
	// implementation 'org.flywaydb:flyway-core:11.5.0'
	// implementation 'org.flywaydb:flyway-mysql:11.5.0'

	implementation 'org.springframework.boot:spring-boot-starter-flyway' // dep changed from flyway-core
	implementation 'org.flywaydb:flyway-mysql'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'redis.clients:jedis:7.2.0'	
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	// Adds health checks, metrics, and tracing integration through Spring Boot Actuator.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Bridges Spring Boot observations to the OpenTelemetry SDK and OTLP exporters.
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	// Registers the Prometheus meter registry used by the /actuator/prometheus endpoint.
	implementation 'io.micrometer:micrometer-registry-prometheus:1.17.0-M3'
	// Sends Logback events to the OpenTelemetry Collector with trace correlation metadata.
	implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.21.0-alpha'
	// Keeps the Prometheus registry available at runtime when the application is packaged.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus:1.17.0-M3'

}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
    jvmArgs = ['-javaagent:newrelic/newrelic.jar']
}
