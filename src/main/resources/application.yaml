spring:
  # Starts the local observability dependencies with the Spring Boot application.
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
  application:
    name: FakeCommerce
  # MySQL connection used by the running application.
  datasource:
    url: jdbc:mysql://localhost:3306/fakecommerce
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # Print generated SQL and validate the schema against the entity mappings.
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    # Apply database migrations from the classpath before the application starts.
    enabled: true
    locations: classpath:db/migration

  # logging:
  #   level:
  #     org.flywaydb: DEBUG

  redis:
    # Local Redis instance used for application caching or other fast key-value data.
    host: localhost
    port: 6379

# Expose selected Spring Boot Actuator endpoints over HTTP.
management:
  # Publishes application metrics to the local OTLP HTTP collector endpoint.
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
        histogram-flavour: explicit-bucket-histogram
  # Exports application logs and traces to the local Grafana OTEL collector.
  opentelmetry:
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    # Enables trace generation for every request during local development.
    export:
      enabled: true
    sampler:
      probability: 1.0

  endpoints:
    web:
      exposure:
        # Metrics are available at /actuator/metrics; health is useful for readiness checks.
        include: "health,metrics,prometheus"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: always

server:
  shutdown: immediate
logging:
  level:
    com.example.FakeCommerce: INFO
    org.springframework.boot.docker.compose: DEBUG
