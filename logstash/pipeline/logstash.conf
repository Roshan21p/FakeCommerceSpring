# Accept JSON log events over TCP from the Spring Boot application's Logback appender.
input {
    tcp {
        port => 5044
        codec => json
    }
}

# Index each event in Elasticsearch using a daily time-based index.
output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "logs-%{+YYYY.MM.dd}"
    }
}